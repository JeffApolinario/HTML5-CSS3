<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.container {
            background-color: orange;
         
            display: flex;
            height: 300px;
            flex-flow: row nowrap;
            justify-content: space-around; /* Alinhará os itens ao meio de cada partição criada no sentido do MAIN-AXIS*/
            align-items: center; /* Centralizará os itens com base no eixo transversal CROSS-AXIS*/
         }
        div.item {
            border: 1px solid black;
            background-color: aliceblue;
            
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">Exemplo de Bloco A</div>
        <div class="item">Exemplo de Bloco B</div>
        <div class="item">Exemplo de Bloco C</div>
        <div class="item">Exemplo de Bloco D</div>
        <div class="item">Exemplo de Bloco E</div>
        <div class="item">Exemplo de Bloco F</div>
        <div class="item">Exemplo de Bloco G</div>
    </div>
</body>
</html>
